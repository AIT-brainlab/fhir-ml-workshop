[project]
name = "fhir-ml-workshop"
version = "0.1.0"
description = "FHIR to Model - a hands-on machine learning workshop"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "pandas>=2.2",
    "numpy>=1.26",
    "scikit-learn>=1.5",
    "matplotlib>=3.8",
    "joblib>=1.4",
    "streamlit>=1.38",
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "pydantic>=2.8",
]

[tool.uv]
package = false
